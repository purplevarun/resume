name: Supabase Keepalive

on:
  schedule:
    # Runs once a day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret" >&2
            exit 1
          fi

          http_status=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/resume_sync?select=updated_at&limit=1")

          echo "Supabase responded with HTTP $http_status"

          if [ "$http_status" -ge 400 ]; then
            echo "Keepalive ping failed" >&2
            exit 1
          fi
